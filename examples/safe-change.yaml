# Safe change: bump the image to a tested, pinned version, raise the memory
# limit, and add a feature flag. Everything a reviewer wants to see.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: prod
  labels:
    app: checkout-api
    critical: "true"
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: checkout-api
          image: registry.example.com/checkout-api:2.4.2
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgres://db.example.internal:5432/checkout
            - name: REDIS_URL
              value: redis://redis.example.internal:6379
            - name: LOG_LEVEL
              value: info
            - name: FEATURE_FLAG_X
              value: "true"
          resources:
            limits:
              cpu: "500m"
              memory: 640Mi
            requests:
              cpu: "250m"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: checkout-api
  namespace: prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: checkout-api
